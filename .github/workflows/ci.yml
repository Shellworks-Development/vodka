name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: native container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test
        run: ctest --test-dir build/native --output-on-failure

  android:
    name: android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vodka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  payloads:
    name: runtime payloads
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build
      - name: Build ARM64 rootfs
        run: ./runtime/rootfs-arm64/build.sh
      - name: Build x86-64 Wine rootfs
        run: ./runtime/rootfs-x86_64/build.sh
      - name: Build FEX (aarch64)
        run: ./runtime/fex/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-payloads
          path: |
            build/rootfs/rootfs-arm64.tar.gz*
            build/rootfs/rootfs-x86_64.tar.gz*
            build/fex-out/fex-arm64.tar.gz*
          if-no-files-found: error
          if-no-files-found: error
