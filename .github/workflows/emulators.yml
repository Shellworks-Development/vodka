name: emulators

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: both
        options:
          - both
          - box64
          - fex
          - winerootfs
          - rootfsarm64
          - mesa
          - all
      thunks:
        description: Build FEX host thunks (Vulkan/GL/EGL)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  box64:
    name: box64 (aarch64)
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'box64' || github.event.inputs.target == 'all' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream revision
        id: rev
        run: echo "sha=$(git ls-remote https://github.com/ptitSeb/box64.git HEAD | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: out/box64
          key: box64-${{ steps.rev.outputs.sha }}-v1

      - name: Build box64
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/ptitSeb/box64.git box64-src
          cmake -S box64-src -B box64-src/build -G Ninja \
            -DARM64=1 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build box64-src/build --parallel
          mkdir -p out/box64/usr/bin
          cp box64-src/build/box64 out/box64/usr/bin/box64

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p out
          strip out/box64/usr/bin/box64 || true
          chmod 755 out/box64/usr/bin/box64
          file out/box64/usr/bin/box64
          tar -czf out/box64-aarch64.tar.gz -C out/box64 .
          ( cd out && sha256sum box64-aarch64.tar.gz > box64-aarch64.tar.gz.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: box64-aarch64
          path: |
            out/box64-aarch64.tar.gz
            out/box64-aarch64.tar.gz.sha256
          if-no-files-found: error

  fex:
    name: fex (aarch64)
    if: ${{ github.event.inputs.target == 'both' || github.event.inputs.target == 'fex' || github.event.inputs.target == 'all' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream revision
        id: rev
        run: echo "sha=$(git ls-remote https://github.com/FEX-Emu/FEX.git HEAD | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: cache
        with:
          path: stage
          key: fex-${{ steps.rev.outputs.sha }}-${{ github.event.inputs.thunks }}-v1

      - name: Build FEX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3 pkg-config clang lld build-essential
          if [ "${{ github.event.inputs.thunks }}" = "true" ]; then
            sudo apt-get install -y libvulkan-dev libgl1-mesa-dev libegl1-mesa-dev \
              libx11-dev libxcb1-dev libxkbcommon-dev libdrm-dev libasound2-dev
          fi
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/FEX-Emu/FEX.git fex-src
          cmake -S fex-src -B fex-src/build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_LTO=True \
            -DBUILD_FEXCONFIG=FALSE \
            -DBUILD_TESTING=False \
            -DBUILD_THUNKS=${{ github.event.inputs.thunks }}
          cmake --build fex-src/build --parallel
          rm -rf stage
          DESTDIR="$PWD/stage" cmake --install fex-src/build

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p out
          rm -f stage/usr/bin/FEXConfig
          tar -czf out/fex-aarch64.tar.gz -C stage .
          ( cd out && sha256sum fex-aarch64.tar.gz > fex-aarch64.tar.gz.sha256 )
          ls -l stage/usr/bin
          find stage/usr/lib -maxdepth 3 -name 'HostThunks' -type d -print || true

      - uses: actions/upload-artifact@v4
        with:
          name: fex-aarch64
          path: |
            out/fex-aarch64.tar.gz
            out/fex-aarch64.tar.gz.sha256
          if-no-files-found: error

  winerootfs:
    name: wine rootfs (amd64)
    if: ${{ github.event.inputs.target == 'winerootfs' || github.event.inputs.target == 'all' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build x86-64 Wine rootfs
        env:
          VODKA_BUILDX_CACHE: "1"
        run: ./runtime/rootfs-x86_64/build.sh

      - name: Show output
        run: ls -lh build/rootfs

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-x86_64
          path: build/rootfs/rootfs-x86_64.tar.gz*
          if-no-files-found: error

  rootfsarm64:
    name: arm64 rootfs (mesa/turnip)
    if: ${{ github.event.inputs.target == 'rootfsarm64' || github.event.inputs.target == 'all' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ARM64 rootfs
        env:
          VODKA_BUILDX_CACHE: "1"
        run: ./runtime/rootfs-arm64/build.sh

      - name: Show output
        run: ls -lh build/rootfs

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-arm64
          path: build/rootfs/rootfs-arm64.tar.gz*
          if-no-files-found: error

  mesa:
    name: mesa turnip kgsl (aarch64)
    if: ${{ github.event.inputs.target == 'mesa' || github.event.inputs.target == 'all' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: stage
          key: mesa-24.3.4-v1

      - name: Build Mesa (Turnip, kgsl) in bookworm
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD":/w -w /w debian:bookworm \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                ninja-build python3-mako python3-pip python3-yaml python3-ply pkg-config git ca-certificates \
                gcc g++ libdrm-dev libexpat1-dev zlib1g-dev libzstd-dev byacc flex \
                libvulkan-dev
              pip3 install --break-system-packages --quiet meson
              git clone --depth 1 --branch mesa-24.3.4 \
                https://gitlab.freedesktop.org/mesa/mesa.git mesa-src
              meson setup mesa-src/build mesa-src \
                --prefix=/usr \
                --buildtype=release \
                -Dvulkan-drivers=freedreno \
                -Dgallium-drivers=freedreno \
                -Dfreedreno-kmds=kgsl \
                -Dglx=disabled \
                -Dplatforms= \
                -Dllvm=disabled
              ninja -C mesa-src/build
              rm -rf stage
              DESTDIR=/w/stage ninja -C mesa-src/build install
              cc -O2 /w/tools/vulkan-probe/probe.c -lvulkan -o /w/stage/usr/bin/vkprobe
            '

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p out
          tar -czf out/mesa-turnip-aarch64.tar.gz -C stage .
          ( cd out && sha256sum mesa-turnip-aarch64.tar.gz > mesa-turnip-aarch64.tar.gz.sha256 )
          find stage -name 'freedreno_icd*.json' -o -name 'libvulkan_freedreno.so' | head

      - uses: actions/upload-artifact@v4
        with:
          name: mesa-turnip-aarch64
          path: |
            out/mesa-turnip-aarch64.tar.gz
            out/mesa-turnip-aarch64.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish runtime release
    if: ${{ github.event.inputs.target == 'all' }}
    needs: [box64, fex, winerootfs, rootfsarm64, mesa]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-latest
          name: Vodka runtime (latest)
          make_latest: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
